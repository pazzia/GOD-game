<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Crect%20width%3D%2248%22%20height%3D%2248%22%20rx%3D%2213%22%20fill%3D%22%23252647%22%2F%3E%3Cpath%20d%3D%22m24%207%205%2012%2012%205-12%205-5%2012-5-12-12-5%2012-5Z%22%20fill%3D%22%23F7D760%22%2F%3E%3C%2Fsvg%3E">
  <title>Почти бог — визуальная история 01</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="preview-shell">
    <header class="preview-header" aria-label="Панель просмотра макетов">
      <div><span class="preview-kicker">ПОЧТИ БОГ / НОВОЕ НАЧАЛО</span><h1>Солнечный театр невозможного</h1></div>
      <div class="preview-note">Предложение для обсуждения · интерфейс и сюжет</div>
    </header>
    <nav class="preview-nav" id="preview-nav" aria-label="Экраны прототипа"></nav>
    <main class="frame-space" id="frame-space">
      <div class="game-frame" id="game-frame" role="region" aria-label="Макет игры"></div>
    </main>
    <footer class="preview-footer">
      <p id="screen-description"></p>
      <div class="preview-actions"><button id="previous-screen" aria-label="Предыдущий экран">←</button><span id="screen-position"></span><button id="next-screen" aria-label="Следующий экран">→</button><button id="restart-flow">С начала</button></div>
    </footer>
    <p class="preview-limits">Локальный визуальный прототип. Нажимайте выделенные предметы и кнопки, чтобы пройти историю. Это предложение интерфейса и правил; оно не меняет установленную игру.</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
