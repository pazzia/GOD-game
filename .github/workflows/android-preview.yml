name: Android preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'android-preview-*'
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'tests/reports/**'

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Configure runner-local paths
        run: |
          printf '%s\n' \
            "TOOLS_DIR=$RUNNER_TEMP/god-native-tools" \
            "APK_OUTPUT_DIR=$GITHUB_WORKSPACE/build/ci-android" \
            "PREVIEW_KEYSTORE=$RUNNER_TEMP/god-signing/preview-debug.keystore" \
            "XDG_CONFIG_HOME=$RUNNER_TEMP/god-config" \
            "XDG_CACHE_HOME=$RUNNER_TEMP/god-cache" \
            "XDG_DATA_HOME=$RUNNER_TEMP/god-data" >> "$GITHUB_ENV"

      - name: Check out the exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install runtime and verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg dpkg libfontconfig1 libx11-6 libxcursor1 libxinerama1 libgl1 libxrandr2 libxi6 libasound2t64 libpulse0
          python -m pip install Pillow==12.3.0 numpy==2.3.5
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_DATA_HOME"

      - name: Download and verify pinned Godot and Android tools
        run: python tools/bootstrap_native.py --tools-dir "$TOOLS_DIR" --no-graphics

      - name: Verify project, build APK, and check signature and resources
        run: |
          python tools/ci_android.py --tools-dir "$TOOLS_DIR" --output-dir "$APK_OUTPUT_DIR" --debug-keystore "$PREVIEW_KEYSTORE" --source-sha "$GITHUB_SHA"

      - name: Preserve build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-android/*.log
            build/ci-android/*.build.json
            build/ci-android/*.inspection.json
            tests/reports/project-verification.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish verified test APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="android-preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          gh release create "$release_tag" \
            "$APK_OUTPUT_DIR/AlmostGod-0.5.0-preview.apk" \
            "$APK_OUTPUT_DIR/AlmostGod-0.5.0-preview.build.json" \
            "$APK_OUTPUT_DIR/project-verification.json" \
            "$APK_OUTPUT_DIR/provenance.json" \
            "$APK_OUTPUT_DIR/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Почти бог — Android preview ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes-file "$APK_OUTPUT_DIR/release-notes.md"
          echo "[Download test APK](https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}/AlmostGod-0.5.0-preview.apk)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral test signing key
        if: always()
        run: rm -f -- "$PREVIEW_KEYSTORE"
